[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-commerce-agent"
version = "0.1.0"
description = "Voice Commerce Agent — 电商语音客服（文字 MVP）"
requires-python = ">=3.11"
dependencies = [
    "langchain>=0.3.27",
    "langchain-openai>=0.3.0",
    "langgraph>=0.4.0",
    "openai>=1.40.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.0",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
voice-commerce = "voice_commerce.cli:main"

[tool.setuptools.packages.find]
include = ["voice_commerce*", "domain*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
